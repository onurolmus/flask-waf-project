load_module /usr/local/nginx/modules/ngx_http_modsecurity_module.so;

worker_processes auto;

error_log /dev/stderr info;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;

    # Flask API upstream tanımı
    # "app" Docker Compose servis adı, 5000 uWSGI portu
    upstream flask_backend {
        server app:5000;
    }

    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;

        ssl_protocols TLSv1.2 TLSv1.3;

        modsecurity on;
        modsecurity_rules_file /etc/nginx/modsecurity/main.conf;

        location / {
            proxy_pass http://flask_backend;

            # İstemcinin gerçek IP adresini Flask'a ilet
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Orijinal Host bilgisini koru
            proxy_set_header Host $host;

            # Proxy'den geldiği bilgisini Flask'a ilet
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}